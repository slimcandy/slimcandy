name: Weekly rebuild

# Refreshes build-time data (YouTube videos, GitHub repo stats).
# Needs a Netlify build hook URL stored as the NETLIFY_BUILD_HOOK secret.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK secret is not set, skipping"
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
